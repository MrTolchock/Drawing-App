<!doctype html>
<html lang="de-CH"><head><meta charset="utf-8"><title>Neighbour portraits (development)</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><canvas id="c" width="1536" height="1536"></canvas>
<script type="module">
/* Deterministic identity portrait from the current plush model. */
import {THREE} from '../../js/scene/materials.js';
import {characters,castReady} from '../../js/friends/characters3d.js';
await castReady;
window.FK=window.FK||{reduced:true};
const q=new URLSearchParams(location.search),id=q.get('id')||'deer',canvas=document.getElementById('c');
const YAW={fish:.42,kingfisher:.62};
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setClearColor(0,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=+(q.get('exposure')||1.12);
const scene=new THREE.Scene();
scene.add(new THREE.HemisphereLight('#fff4de','#9c7a52',1.35));
const key=new THREE.DirectionalLight('#ffe6bd',2.3);key.position.set(-2.5,4,6);scene.add(key);
const fill=new THREE.DirectionalLight('#fff3e2',.75);fill.position.set(4,1.5,4);scene.add(fill);
const rim=new THREE.DirectionalLight('#fffaf0',1.2);rim.position.set(2.5,3,-4);scene.add(rim);
const model=id==='fox-sleep'?'fox':id;const rig=characters[model](1);rig.group.rotation.set(0,YAW[model]??.4,0);scene.add(rig.group);rig.update(.016,{reduced:true,action:id==='fox-sleep'?'sleep':''});
// Generous frame around the body's origin; the crop happens in render.cjs.
const camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,50);camera.position.set(0,.5,10);camera.lookAt(0,.5,0);
renderer.render(scene,camera);window.colour=canvas.toDataURL('image/png');
window.ready=true;
</script></body></html>
