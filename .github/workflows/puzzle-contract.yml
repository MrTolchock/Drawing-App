name: Puzzle contract
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/puzzle-catalogue.cjs --check
      - run: node --test tests/*.test.cjs
