<!doctype html>
<html lang="de-CH"><head><meta charset="utf-8"><title>World map (development)</title>
<style>html,body{margin:0;background:#222;color:#eee;font:12px system-ui}canvas{display:block;image-rendering:pixelated}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
/* Development view: the big world from above, drawn from the terrain functions (height shading, water,
   trails, crossings, friends). ?s=4 sets pixels per metre; ?nav=1 shades where Fuchs cannot walk. */
import {THREE} from '../js/scene/materials.js';
import {createTerrain} from '../js/friends/world/big/terrain.js';
import * as L from '../js/friends/world/big/layout.js';
const q = new URLSearchParams(location.search), S = +(q.get('s') || 3), T = createTerrain(), E = L.EXTENT;
const W = (E.x1 - E.x0) * S, H = (E.z1 - E.z0) * S, c = document.getElementById('c'); c.width = W; c.height = H;
const g = c.getContext('2d'), img = g.createImageData(W, H), col = new THREE.Color(), sun = new THREE.Vector3(-.55, .62, -.56).normalize();
let world = null; if (q.get('nav')) world = (await import('../js/friends/world/big/index.js')).createBigWorld();
for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
  const x = E.x0 + (i + .5) / S, z = E.z0 + (j + .5) / S, e = .5, h = T.ground(x, z), hx = T.ground(x + e, z) - h, hz = T.ground(x, z + e) - h;
  const n = new THREE.Vector3(-hx / e, 1, -hz / e).normalize(); T.colour(x, z, col); T.cliff(x, z, n.y, col);
  let k = .55 + .6 * Math.max(0, n.dot(sun)); const d = T.stillDepth(x, z), s = T.streamAt(x, z);
  if (d > 0) { col.set('#3f8f9a').lerp(new THREE.Color('#1d5a6e'), Math.min(1, d)); k = 1; } else if (s.d < s.w / 2) { col.set('#58a9b0'); k = 1; }
  if (world && !world.walkable(x, z)) col.lerp(new THREE.Color('#301020'), .45);
  if (T.edge(x, z) < 9) col.lerp(new THREE.Color('#000'), .35);
  const o = (j * W + i) * 4; col.convertLinearToSRGB(); img.data[o] = 255 * Math.min(1, col.r * k); img.data[o + 1] = 255 * Math.min(1, col.g * k); img.data[o + 2] = 255 * Math.min(1, col.b * k); img.data[o + 3] = 255;
}
g.putImageData(img, 0, 0);
const P = (x, z) => [(x - E.x0) * S, (z - E.z0) * S];
g.lineWidth = 2; g.strokeStyle = '#ffd'; for (const cr of T.crossings) { g.beginPath(); g.moveTo(...P(...cr.a)); g.lineTo(...P(...cr.b)); g.stroke(); }
g.font = 'bold 11px system-ui'; g.textAlign = 'center';
const mark = (name, x, z, colr) => { const [px, pz] = P(x, z); g.fillStyle = colr; g.beginPath(); g.arc(px, pz, 4, 0, 7); g.fill(); g.strokeStyle = '#000'; g.lineWidth = 3; g.strokeText(name, px, pz - 7); g.fillStyle = '#fff'; g.fillText(name, px, pz - 7); };
for (const [id, f] of Object.entries(L.FRIENDS)) mark(id, ...f.at, '#f80');
for (const [id, f] of Object.entries(L.NEIGHBOURS)) mark(id, ...f.at, '#0cf');
mark('den', L.DEN.x, L.DEN.z, '#fff'); mark('lip', ...T.falls.lip, '#f0f'); mark('base', ...T.falls.base, '#f0f');
if (world && world.trees) { g.fillStyle = 'rgba(20,60,10,.7)'; for (const t of world.allTrees()) { const [px, pz] = P(t.x, t.z); g.beginPath(); g.arc(px, pz, Math.max(1.5, t.r * S), 0, 7); g.fillStyle = {spruce: 'rgba(10,50,40,.8)', birch: 'rgba(230,240,200,.9)'}[t.kind] || 'rgba(30,80,20,.75)'; g.fill(); } }
window.terrain = T; window.ready = true;
</script></body></html>
