<!doctype html>
<html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forest friends model sheet</title>
<style>html,body{margin:0;height:100%;background:#efe4cc}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
/* Development model sheet: renders the baked plush cast side by side (front and three-quarter), plus Fuchs asleep (?sleep=1). */
import {THREE} from '../js/forest/materials.js';
import {characters,castReady} from '../js/friends/characters3d.js';
await castReady;
window.FK=window.FK||{reduced:true};
const canvas=document.getElementById('c'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();scene.background=new THREE.Color('#efe4cc');scene.add(new THREE.HemisphereLight('#ffe9c2','#6b5636',1.3));const sun=new THREE.DirectionalLight('#ffd9a0',2.4);sun.position.set(-3,6,5);scene.add(sun);
const ids=['fox','squirrel','bird','owl','mouse','beaver','mailman'],rigs=[];
ids.forEach((id,i)=>{for(const [row,yaw] of [[0,0],[1,.7]]){const r=characters[id](id==='bird'?.8:1.4);r.group.position.set((i-3)*1.75,row?-2.1:0,0);r.group.rotation.y=yaw;scene.add(r.group);rigs.push(r);}});
const camera=new THREE.PerspectiveCamera(30,1,.1,100);camera.position.set(0,.6,13);camera.lookAt(0,-.4,0);
const sleeping=new URLSearchParams(location.search).has('sleep');if(sleeping){const r=characters.fox(1.4);r.group.position.set(0,-4.2,0);r.group.rotation.y=.3;scene.add(r.group);r.sleep=true;rigs.push(r);camera.position.set(0,-1,15);camera.lookAt(0,-1.4,0);}
function frame(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();rigs.forEach(r=>r.update(.016,{reduced:true,action:r.sleep?'sleep':''}));renderer.render(scene,camera);requestAnimationFrame(frame);}frame();window.ready=true;
</script></body></html>
