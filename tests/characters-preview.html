<!doctype html>
<html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forest friends model sheet</title>
<style>html,body{margin:0;height:100%;background:#efe4cc}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
/* Development model sheet: renders the baked plush cast side by side (front and three-quarter), plus Fuchs asleep (?sleep=1). */
import {THREE} from '../js/forest/materials.js';
import {characters,castReady} from '../js/friends/characters3d.js';
await castReady;
window.FK=window.FK||{reduced:true};
const canvas=document.getElementById('c'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();scene.background=new THREE.Color('#efe4cc');scene.add(new THREE.HemisphereLight('#ffe9c2','#6b5636',1.3));const sun=new THREE.DirectionalLight('#ffd9a0',2.4);sun.position.set(-3,6,5);scene.add(sun);
const only=new URLSearchParams(location.search).get('only'),ids=only?only.split(','):['fox','squirrel','bird','owl','mouse','beaver','mailman'],rigs=[],mid=(ids.length-1)/2;   // ?only=deer,frog,… shows other characters
const cast=[];ids.forEach((id,i)=>{for(const [row,yaw] of [[0,0],[1,.7]]){const r=characters[id](id==='bird'||id==='kingfisher'?.8:id==='frog'||id==='hedgehog'||id==='fish'?1:id==='badger'?1.2:1.4);r.group.rotation.y=yaw;scene.add(r.group);rigs.push(r);cast.push({r,i,row});}});
const camera=new THREE.PerspectiveCamera(30,1,.1,200),sleeping=new URLSearchParams(location.search).has('sleep');
let sleeper=null;if(sleeping){sleeper=characters.fox(1.4);sleeper.group.rotation.y=.3;scene.add(sleeper.group);sleeper.sleep=true;rigs.push(sleeper);}
// Landscape: front row above three-quarter row. Portrait: one character per row, front left and three-quarter right.
// The camera backs off until the whole sheet fits.
function layout(aspect){
  const wide=aspect>=1,t=Math.tan(THREE.MathUtils.degToRad(15));
  for(const {r,i,row} of cast)wide?r.group.position.set((i-mid)*1.75,row?-2.1:0,0):r.group.position.set(row?.9:-.9,(mid-i)*1.95-.8,0);
  const halfW=wide?mid*1.75+1.05:2,top=wide?1.6:mid*1.95+1.05,bottom=sleeper?(wide?-5.4:-mid*1.95-3.55):(wide?-2.6:-mid*1.95-1.45),cy=(top+bottom)/2;
  if(sleeper)sleeper.group.position.set(0,wide?-4.2:-mid*1.95-2.65,0);
  const d=Math.max(halfW/(t*aspect),(top-bottom)/2/t)*1.06;camera.position.set(0,cy+.6,d);camera.lookAt(0,cy,0);
}
function frame(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;layout(camera.aspect);camera.updateProjectionMatrix();rigs.forEach(r=>r.update(.016,{reduced:true,action:r.sleep?'sleep':''}));renderer.render(scene,camera);requestAnimationFrame(frame);}frame();window.ready=true;
</script></body></html>
