<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waldbuch forest look-dev</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e8dcae}
  canvas{display:block;width:100vw;height:100vh}
  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 58%,#3b240f30 82%,#2a170860 100%)}
  .hud{position:fixed;top:16px;right:16px;display:flex;gap:10px;padding:8px;border-radius:28px;background:#fff8e8e6;border:2px solid #e2c99a;box-shadow:0 10px 24px #5a3f2420}
  .hud span{width:60px;height:60px;box-sizing:border-box;padding:7px;border-radius:18px;background:url(../../../assets/forest-friends/interface-icons.webp) no-repeat,#fff8e8;background-size:200% 200%,auto;background-origin:content-box;background-clip:content-box,padding-box;border:2px solid #c98d3e;box-shadow:0 5px 0 #a8703f}
  .spot{position:fixed;width:78px;height:78px;margin:-39px 0 0 -39px;border-radius:50%;background:radial-gradient(circle,#fffaf0 0 56%,#fff6dccc 57% 64%,transparent 65%);box-shadow:0 0 0 3px #f2cf7e inset,0 0 0 10px #ffe3a033,0 8px 16px #3b22122e;display:grid;place-items:center}
  .spot i{width:50px;height:50px;border-radius:50%;background:url(../../../assets/forest-friends/postcard-friends.webp) no-repeat;background-size:300% 200%}
  .spot.invited{box-shadow:0 0 0 4px #f5b443 inset,0 0 0 12px #ffd36b55,0 8px 16px #3b22122e}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="hud" id="hud" hidden>
  <span style="background-position:0 0"></span><span style="background-position:100% 0"></span><span style="background-position:0 100%"></span><span style="background-position:100% 100%"></span>
</div>
<script type="module">
  await import('./forest.js');
  const q=new URLSearchParams(location.search);
  if(q.get('hud')!=='0'){
    document.getElementById('hud').hidden=false;
    const add=(xy,pos,cls='')=>{const d=document.createElement('div');d.className='spot '+cls;d.style.left=xy[0]+'px';d.style.top=xy[1]+'px';const i=document.createElement('i');i.style.backgroundPosition=pos;d.append(i);document.body.append(d);};
    const a=window.stats.anchors;
    if((q.get('view')||'hero')==='hero'){add(a.squirrel,'0 0','invited');add(a.owl,'100% 0');}
  }
  window.ready=true;
</script>
</body>
</html>
