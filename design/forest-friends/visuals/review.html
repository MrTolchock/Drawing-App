.puzzle-head{text-align:center;margin:2px 22px 0}.puzzle-head .overline{font-size:13px;letter-spacing:1px;color:var(--muted)}.puzzle-head h2{font-size:30px;font-weight:700;margin:8px 0}.dots{display:flex;gap:8px;align-items:center}.dots span{width:12px;height:12px;border:2px solid #9aa993;border-radius:50%;background:transparent}.dots span.done{background:var(--green);border-color:var(--green)}.dots span.task-progress{width:auto;height:auto;border:0;border-radius:0;background:none;font-size:12px;color:var(--muted);margin-left:5px;white-space:nowrap}.board{position:relative;margin:28px auto 22px;width:76%;height:245px;border-radius:32px;background:#ece6d3;box-shadow:inset 0 0 0 1px #d4d0bc;display:flex;align-items:center;justify-content:center}.ten-frame{display:grid;grid-template-columns:repeat(5,66px);gap:12px;padding:20px}.nut-cell{width:66px;height:66px;background:#f9f3e4;border:1px solid #dcd5bc;border-radius:14px;display:grid;place-items:center}.nut{border:0;position:relative;background:transparent;width:62px;height:62px;display:grid;place-items:center}.nut svg{width:55px;height:55px}.nut.marked:after{content:'✓';position:absolute;right:0;bottom:0;border-radius:50%;background:var(--green);color:white;width:23px;height:23px;font:700 16px system-ui}.choices{display:flex;justify-content:center;gap:20px}.answer{width:100px;min-height:78px;border:2px solid #d5d6c7;background:white;border-radius:19px;font-size:35px;font-weight:700;box-shadow:0 4px 0 #dedccb}.answer.selected{border-color:var(--green);background:#e7eddf;box-shadow:0 4px 0 #91a17e}.answer.picture{width:160px;height:135px;display:grid;place-items:center}.answer.picture svg{width:112px;height:92px}.word{font-size:65px;letter-spacing:2px;color:var(--ink);font-weight:700;padding:20px}.word-card{height:160px;background:#f2ead9;border-radius:25px;margin:25px auto;width:50%;display:grid;place-items:center}.feedback{text-align:center;min-height:32px;margin:18px 20px 0;font-size:16px}.puzzle-bottom{position:abso ;padding:28px;background:var(--paper);color:var(--ink)}dialog::backdrop{background:#17302570}dialog h2{margin-top:0}dialog p{line-height:1.6}svg{overflow:visible} @media(max-width:850px){.review{padding:16px 12px}.frame{min-height:690px;border-radius:18px}.hud{padding:16px;gap:7px}.hud .pill{padding:10px}.ten-frame{grid-template-columns:repeat(5,52px);gap:8px;padding:12px}.nut-cell{width:52px;height:58px}.nut{width:50px;height:54px}.nut svg{width:44px}.board{width:88%;height:220px}.bottom-card{left:14px;right:14px;bottom:14px;flex-wrap:wrap;padding:14px}.puzzle-bottom{left:14px;right:14px;bottom:18px;flex-wrap:wrap;justify-content:center}.tools .pill{padding:9px}.puzzle-head h2{font-size:25px}.answer.picture{width:115px}.shop-body{gap:14px;padding:0 18px 130px}.item-preview{padding:15px}.item-preview>svg{width:130px}.review-title{align-items:flex-start}.draft{display:none}.door{right:12%;top:44%}}@media(max-width:480px){.frame{min-height:840px}.hud{flex-wrap:wrap}.hud-group:first-child{margin-right:auto}.hud-group:last-child{margin-left:auto}.scene-label{top:162px}.hud-group{gap:5px}.hud .pill{font-size:12px}.pill strong{font-size:14px}.task-progress{display:none}.puzzle-head{margin-top:12px}.puzzle-head h2{font-size:22px}.board{height:220px}.ten-frame{grid-template-columns:repeat(5,48px);gap:4px}.nut-cell{width:48px;height:58px}.nut{width:48px}.nut svg{width:38px}.answer{width:80px}.answer.picture{width:90px;height:115px}.answer.picture svg{width:77px}.shop-body{grid-template-columns:1fr}.item{min-height:100px}.item svg{height:40px}.item-preview{min-height:180px}.item-preview>svg{height:70px}.item-preview p{margin:6px}.item-preview h3{margin:5px}.shop-title h2{font-size:23px}.word-card{width:70%}.scene-label{left:16px;right:16px;max-width:none;top:94px}.friend-a{left:8%;top:36%}.friend-b{right:8%;top:55%}}
</style>

<body>
<div class="review">
<header class="review-title"><div><div class="eyebrow">Forest friends / design study 01</div><h1>Ein Zuhause im Wald</h1></div><span class="draft">Visual proposal · 7 November 2026</span></header>
<nav class="tabs" aria-label="Designansichten"></nav>
<main class="frame" id="frame" aria-label="Spielentwurf"></main>
<p class="caption" id="caption" lang="en"></p>
<div class="review-tools" lang="en"><button id="reset">Reset this review</button><span>Disposable visual prototype. Sample tasks and wallet stay in this tab only; existing game saves are untouched.</span></div>
</div>
<dialog id="note"><h2 id="note-title"></h2><p id="note-text"></p><button class="btn" id="note-close">Zurück</button></dialog>
<script>
const frame=document.querySelector('#frame');
const shapes={
 nut:'<path d="M20 19C9 23 9 44 22 52c14 2 26-12 23-25-2-9-17-12-25-8Z" fill="#b17b46" stroke="#785531" stroke-width="2"/><path d="M14 26c4-14 22-20 31-7l1 10c-10-3-22-3-32 0Z" fill="#745d36"/><path d="m29 16 3-10" stroke="#745d36" stroke-width="4" stroke-linecap="round"/><path d="M23 34c-3 6-1 10 3 13" stroke="#d0a473" stroke-width="3" fill="none"/>',
 home:'<path d="m7 27 23-20 23 20M13 25v28h34V25M25 53V35h11v18" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>',
 map:'<path d="m7 16 15-7 16 7 15-7v36l-15 7-16-7-15 7ZM22 9v36m16-29v36" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>',
 back:'<path d="m34 13-17 17 17 17M18 30h31" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>',
 sound:'<path d="M9 24h10L32 13v34L19 36H9ZM40 20q14 10 0 20m6-29q24 19 0 38" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>',
 help:'<path d="M20 22a11 11 0 1 1 17 9c-5 3-7 5-7 10M30 49v2" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="30" cy="30" r="27" fill="none" stroke="currentColor" stroke-width="2"/>',
 play:'<path d="m22 12 26 18-26 18Z" fill="currentColor"/>',
 bag:'<path d="M17 9h26l-7 13c24 18 19 32-6 32S0 40 24 22Z" fill="#d4aa67" stroke="#6f623c" stroke-width="2"/><path d="M23 21h15" stroke="#6f623c" stroke-width="4" stroke-linecap="round"/>',
 cushion:'<path d="M9 14q20-9 42 0-5 16 0 32-21 9-42 0 5-17 0-32Z" fill="#c99959" stroke="#9a723d" stroke-width="2"/><path d="M15 18q17-6 30 0m0 24q-16 6-30 0" fill="none" stroke="#e3be87" stroke-width="2"/>',
 apple:'<path d="M30 20C4 8 3 39 19 52c7 4 10-2 12-2s6 6 13 1c14-15 14-41-14-31Z" fill="#b55f46"/><path d="m30 20 2-12" stroke="#745f37" stroke-width="3"/><path d="M33 12q7-12 16-6-5 12-16 6" fill="#6d8a4d"/>',
 stool:'<path d="m16 31-3 23m32-23 3 23m-16-23v23" stroke="#986d3f" stroke-width="6"/><ellipse cx="30" cy="25" rx="24" ry="10" fill="#bd955e" stroke="#815e37" stroke-width="2"/>',
 template:'<rect x="9" y="5" width="43" height="50" rx="4" fill="#fffdf3" stroke="#aeaa8a" stroke-width="2"/><path d="M30 45c-22-14-9-25 11-30 2 20-3 30-11 30ZM30 45l9-26" fill="#a5b57e" stroke="#687d4e" stroke-width="2"/>',
 mouse:'<ellipse cx="33" cy="38" rx="20" ry="14" fill="#9c8872"/><circle cx="19" cy="26" r="12" fill="#aa9681"/><circle cx="36" cy="22" r="11" fill="#aa9681"/><circle cx="19" cy="26" r="7" fill="#d2b7a4"/><circle cx="36" cy="22" r="6" fill="#d2b7a4"/><path d="M16 34 4 44l15 5" fill="#aa9681"/><circle cx="6" cy="43" r="2" fill="#534534"/><circle cx="20" cy="36" r="2.2" fill="#333f31"/><path d="M51 42q14 9 8-12" stroke="#ad9382" stroke-width="3" fill="none"/>',
 house:'<path d="M11 27h38v28H11Z" fill="#d3b585"/><path d="m5 28 25-23 25 23" fill="#a06549" stroke="#855337" stroke-width="2" stroke-linejoin="round"/><rect x="27" y="36" width="12" height="19" rx="3" fill="#7e7d52"/><rect x="15" y="34" width="9" height="10" fill="#eae9c8"/>',
 hat:'<ellipse cx="30" cy="44" rx="28" ry="10" fill="#9e7349"/><path d="m14 41 5-30q12-6 24 0l4 30Z" fill="#bd955e"/><path d="m16 33 30 0" stroke="#566f48" stroke-width="6"/>',
 fox:'<path d="m9 6 17 12h9L51 6l-1 29-20 21L9 34Z" fill="#cc793e"/><path d="m10 31 20 9 20-9-20 25Z" fill="#f5e6c8"/><circle cx="21" cy="29" r="2.3" fill="#293f33"/><circle cx="39" cy="29" r="2.3" fill="#293f33"/><path d="m25 40 10 0-5 6Z" fill="#293f33"/>',
};
const svg=(name)=>`<svg viewBox="0 0 60 60" aria-hidden="true">${shapes[name]||shapes.help}</svg>`;
const tabs=[['home','Zuhause'],['forest','Wald'],['count','Zählen'],['read','Lesen'],['shop','Laden'],['characters','Figuren']];
const captions={home:'Home is the main menu. The door leads outside; the table opens drawing. After a cushion purchase, its placement action appears here. Background: generated scene concept, not a rendered game.',forest:'World composition and pictured destinations. The two buttons open the counting and reading specimens; this scene does not simulate walking or validate the proposed camera.',count:'NUM-01 · MA.1.A.2.a · One counting specimen with seven nuts. Try an incorrect answer, mark objects, request a hint, then correct it. Five dots indicate the planned round structure; this prototype contains one task.',read:'READ-01 · D.2.A.1.b · The instruction can be heard, but the target word is not pronounced automatically. Picture choices have no visible written labels. One specimen; a five-task round is specified separately.',shop:'Proposed economy: the sample bag starts with three nuts. A cushion costs two nuts and an apple one. Previewing never spends resources. Permanent ownership and consumable quantity are distinct.',characters:'Fuchs and Waldkauz: concept reference sheet for future 3D modelling. These are generated design images, not rigged production models or approved assets.'};
let state={page:'home',nuts:3,cushion:false,placed:false,apples:0,item:'cushion',answers:{},solved:{},marked:new Set()};
function button(label,action,cls='btn',icon=''){return `<button class="${cls}" data-action="${action}"${!label?` aria-label="${icon==='back'?'Zurück in den Wald':icon==='map'?'Karte und Wald':'Beutel'}"`:''}>${icon?svg(icon):''}${label}</button>`}
function hud(title,back=false){return `<div class="hud"><div class="hud-group">${back?button('','forest','icon-btn','back'):''}<span class="pill">${svg(title==='Eichhörnchen'?'nut':title==='Maus'?'mouse':title==='Im Laden'?'bag':'home')}<strong>${title}</strong></span></div><div class="hud-group">${button('','forest','icon-btn','map')}<span class="pill">${svg('nut')}<strong>${state.nuts}</strong></span>${button('','bag','icon-btn','bag')}</div></div>`}
function dots(){return `<div class="dots" aria-label="Aufgabe 1 von 5">${[0,1,2,3,4].map(i=>`<span class="${i===0&&state.solved[state.page]?'done':''}"></span>`).join('')}<span class="task-progress">1 von 5</span></div>`}
function puzzle(kind){const counting=kind==='count';return `${hud(counting?'Eichhörnchen':'Maus',true)}<div class="puzzle-head"><div class="overline">${counting?'NÜSSE FÜR DEN WINTER':'ZUSAMMEN LESEN'}</div><h2>${counting?'Wie viele Nüsse sind hier?':'Welches Bild passt zum Wort?'}</h2></div>${counting?`<div class="board"><div class="ten-frame">${Array.from({length:10},(_,i)=>`<div class="nut-cell">${i<7?`<button class="nut ${state.marked.has(i)?'marked':''}" data-mark="${i}" aria-label="Zählobjekt ${i+1}, ${state.marked.has(i)?'markiert':'nicht markiert'}">${svg('nut')}</button>`:''}</div>`).join('')}</div></div><div class="choices">${[6,7,8].map(n=>`<button class="answer ${state.answers.count===String(n)?'selected':''}" aria-pressed="${state.answers.count===String(n)}" data-answer="${n}">${n}</button>`).join('')}</div>`:`<div class="word-card"><div class="word">Maus</div></div><div class="choices">${[['house','Haus'],['mouse','Maus'],['hat','Hut']].map(([n,label])=>`<button class="answer picture ${state.answers.read===n?'selected':''}" aria-label="Bild: ${label}" aria-pressed="${state.answers.read===n}" data-answer="${n}">${svg(n)}</button>`).join('')}</div>`}<div class="feedback" role="status" id="feedback">${state.solved[kind]?'Danke! Das passt.':''}</div><div class="puzzle-bottom"><div class="tools">${button('Anhören','listen','pill','sound')}${button('Beispiel','example','pill','play')}${button('Tipp','hint','pill','help')}</div><div class="hud-group">${dots()}${button(state.solved[kind]?'Zum Wald':'Prüfen',state.solved[kind]?'forest':'check','btn')}</div></div>`}
const items={cushion:{name:'Kissen',cost:2,text:'Ein gemütlicher Platz für dein Zuhause.',icon:'cushion'},apple:{name:'Apfel',cost:1,text:'Ein kleiner Znüni für Fuchs.',icon:'apple'}};
function render(){document.querySelector('.tabs').innerHTML=tabs.map(([id,label])=>`<button data-page="${id}" aria-current="${state.page===id}">${label}</button>`).join('');document.querySelector('#caption').textContent=captions[state.page];let p=state.page;
if(p==='home')frame.innerHTML=`<div class="scene" style="background-image:url('den-v1.png')"></div>${hud('Bei Fuchs')}<div class="spot door">${button('Nach draussen','forest','pill','play')}</div>${state.placed?'<div class="placed-cushion" aria-label="Gekauftes Kissen im Zuhause"></div>':''}<div class="bottom-card"><div><h2>Schön, bist du da.</h2><p>${state.cushion&&!state.placed?'Dein neues Kissen wartet auf einen Platz.':'Was möchtest du heute machen?'}</p></div><div class="actions">${button(state.cushion&&!state.placed?'Kissen platzieren':'Am Tisch malen',state.cushion&&!state.placed?'place':'draw','btn light',state.cushion&&!state.placed?'cushion':'template')}${state.apples?button('Apfel essen','eat','btn light','apple'):''}${button('Freunde besuchen','forest','btn','play')}</div></div>`;
if(p==='forest')frame.innerHTML=`<div class="scene" style="background-image:url('forest-v1.png')"></div>${hud('Im Wald')}<div class="scene-label">Besuche deine Freunde.<br>Jemand freut sich auf deine Hilfe.</div><div class="spot friend-a">${button('Eichhörnchen','count','pill','nut')}</div><div class="spot friend-b">${button('Maus','read','pill','mouse')}</div><div class="bottom-card"><div><h2>Wohin möchtest du?</h2><p>Du darfst auch einfach weiter entdecken.</p></div><div class="actions">${button('Nach Hause','home','btn light','home')}${button('Zum Laden','shop','btn','bag')}</div></div>`;
if(p==='count'||p==='read')frame.innerHTML=puzzle(p);
if(p==='shop'){let i=items[state.item];frame.innerHTML=`${hud('Im Laden',true)}<div class="shop-title"><h2>Etwas für dein Zuhause</h2><p>Schau dich in Ruhe um.</p></div><div class="shop-body"><div class="items">${Object.entries(items).map(([id,it])=>`<button class="item ${state.item===id?'active':''}" data-item="${id}">${svg(it.icon)}<strong>${it.name}</strong><span class="price">${svg('nut')}${id==='cushion'&&state.cushion?'Gehört dir':it.cost+' '+(it.cost===1?'Nuss':'Nüsse')}</span></button>`).join('')}</div><div class="item-preview">${svg(i.icon)}<h3>${i.name}</h3><p>${i.text}</p><span class="price">${svg('nut')}${i.cost} ${i.cost===1?'Nuss':'Nüsse'}</span></div></div><div class="bottom-card"><div><h2>${state.item==='cushion'&&state.cushion?'Das Kissen gehört dir.':state.nuts<i.cost?'Es fehlen noch Nüsse.':'Gefällt dir das?'}</h2><p id="shop-status" role="status">${state.item==='apple'?'Im Beutel: '+state.apples+' '+(state.apples===1?'Apfel':'Äpfel'):'Du kannst es zu Hause aufstellen.'}</p></div><div class="actions">${button('Zurück','forest','btn light')}${button(state.item==='cushion'&&state.cushion?'Nach Hause':'Kaufen',state.item==='cushion'&&state.cushion?'home':'buy','btn honey')}</div></div>`;}
if(p==='characters')frame.innerHTML=`<section class="characters">${hud('Fuchs & Waldkauz')}<img src="characters-v1.png" alt="Figurenentwurf: Fuchs mit grünem Halstuch und Waldkauz in mehreren Ansichten"></section>`;
}
function showNote(title,text){document.querySelector('#note-title').textContent=title;document.querySelector('#note-text').textContent=text;document.querySelector('#note').showModal()}
function say(text){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-CH';u.rate=.85;window.speechSynthesis.speak(u)}
function toast(text){frame.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=text;frame.append(el);setTimeout(()=>el.remove(),4000)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){state.page=b.dataset.page;render();return}if(b.dataset.mark!==undefined){const i=Number(b.dataset.mark);state.marked.has(i)?state.marked.delete(i):state.marked.add(i);render();return}if(b.dataset.answer!==undefined){if(!state.solved[state.page])state.answers[state.page]=b.dataset.answer;render();return}if(b.dataset.item){state.item=b.dataset.item;render();return}const a=b.dataset.action;if(tabs.some(([id])=>id===a)){state.page=a;render();return}if(a==='check'){const correct=state.page==='count'?'7':'mouse';const fb=document.querySelector('#feedback');if(state.answers[state.page]===correct){state.solved[state.page]=true;render()}else fb.textContent=state.answers[state.page]?'Schau noch einmal. Du kannst es ändern.':'Wähle zuerst eine Antwort.'}if(a==='hint'){document.querySelector('#feedback').textContent=state.page==='count'?'Eine volle Reihe hat fünf Nüsse. Wie viele sind darunter?':'Schau dir die Buchstaben in Ruhe an. Welchen Laut hörst du am Anfang?'}if(a==='listen')say(state.page==='count'?'Wie viele Nüsse sind hier?':'Welches Bild passt zum Wort?');if(a==='example')showNote('So geht es',state.page==='count'?'Zähle jede Nuss einmal. Tippe eine Nuss an, um sie zu markieren. Wähle dann die passende Zahl und tippe auf Prüfen.':'Lies das Wort. Wähle das passende Bild. Dann tippe auf Prüfen. In der fertigen Version zeigt dir Maus zuerst ein anderes Wort als Beispiel.');if(a==='bag')showNote('Dein Beutel',`${state.nuts} Nüsse · ${state.apples} ${state.apples===1?'Apfel':'Äpfel'}${state.cushion?' · 1 Kissen':''}`);if(a==='buy'){const i=items[state.item];if(state.nuts<i.cost){toast('Besuche Eichhörnchen, um Nüsse zu sammeln.');return}if(state.item==='cushion'&&state.cushion)return;state.nuts-=i.cost;if(state.item==='cushion')state.cushion=true;else state.apples++;render();toast(state.item==='cushion'?'Das Kissen gehört jetzt dir.':'Ein Apfel für deinen Beutel.')}if(a==='place'){state.placed=true;render();toast('Dein Kissen hat einen Platz gefunden.')}if(a==='eat'&&state.apples>0){state.apples--;render();toast('Mmmh, ein feiner Apfel.')}if(a==='draw')showNote('Am Zeichentisch','Hier kann Fuchs malen und gekaufte Zeichenvorlagen nutzen. Die Zeichenfläche wird in der Entwicklung ergänzt.');});
document.querySelector('#note-close').onclick=()=>document.querySelector('#note').close();document.querySelector('#reset').onclick=()=>{state={page:'home',nuts:3,cushion:false,placed:false,apples:0,item:'cushion',answers:{},solved:{},marked:new Set()};render()};render();
</script>
</body>
</html>
